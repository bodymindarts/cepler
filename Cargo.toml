[package]
name = "cepler"
version = "0.7.20-dev"
authors = ["Justin Carter <justin@galoy.io>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/bodymindarts/cepler"
description = "(Capricious Environment Propagator)-ler"

[features]

fail-on-warnings = []

[dependencies]
anyhow = "1.0.98"
clap = "2.34.0"
git2 = { version = "0.20", features = ["vendored-openssl"] }
glob = "0.3.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.8.26"
serde_json = "1.0.140"

[dev-dependencies]
stringreader = "0.1.1"
